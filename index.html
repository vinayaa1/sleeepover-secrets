<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleepover Secrets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="title-screen">
    <h1>Sleepover Secrets </h1>
    <p>it's 9pm. maya's locket is missing.<br>everyone's a suspect. find the truth.</p>
    <button onclick="start()">start the night</button>
  </div>

  <div id="game" class="hidden">
    <h1>Sleepover Secrets </h1>
    <p id="scene-label"></p>
    <div id="story"></div>
    <div id="choices"></div>
  </div>

  <div id="ending" class="hidden">
    <h1> * </h1>
    <h2 id="end-title"></h2>
    <p id="end-body"></p>
    <button onclick="restart()">play again</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
